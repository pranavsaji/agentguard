name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api-test:
    name: API — install & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('packages/*/pyproject.toml', 'apps/api/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install packages
        run: |
          pip install -e packages/nhi-schema
          pip install -e packages/risk-engine
          pip install -e "apps/api[dev]"
      - name: Verify imports
        run: python -c "from api.core.config import get_settings; from risk_engine.scorer import compute_risk_score; print('imports ok')"
      - name: Run tests
        run: |
          if [ -d apps/api/tests ]; then
            pytest apps/api/tests/ -v
          else
            echo "No tests directory yet — skipping"
          fi

  sensor-install:
    name: Sensor — install & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sensor-${{ hashFiles('packages/*/pyproject.toml', 'apps/sensor/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-sensor-
      - name: Install packages
        run: |
          pip install -e packages/nhi-schema
          pip install -e packages/risk-engine
          pip install -e apps/sensor
      - name: Verify imports
        run: python -c "from sensor.connectors.base import BaseConnector; print('sensor imports ok')"

  risk-engine-test:
    name: Risk Engine — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-risk-${{ hashFiles('packages/risk-engine/pyproject.toml') }}
      - name: Install
        run: |
          pip install -e packages/nhi-schema
          pip install -e packages/risk-engine
          pip install pytest
      - name: Run unit tests
        run: pytest packages/risk-engine/tests -v

  web-lint-build:
    name: Web — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Type-check
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
